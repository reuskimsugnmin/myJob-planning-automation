# 기술 레지스트리 (지식베이스) — 내부/파트너 API · 연동 스펙 전용
# tech-research 가 web-explore/notion-explore/local-source-ingest로 파악한 API·연동 스펙을 누적한다.
# ⚠️ 서드파티 라이브러리/SDK는 여기 넣지 않는다(빠르게 변함) → source-manifest 에 버전+as_of만,
#    사용 시점 Context7 재검증. 이 레지스트리는 재사용·안정적인 내부/파트너 자산 전용.
# 같은 id는 덮어쓰지 말고 최신 기준 갱신 + 기존 출처 보존. 모든 항목 출처 필수.
apis:
  - id: <kebab-stable-id>          # 예: settlement-partner-api
    name: <API/연동 이름>
    kind: partner-api              # internal-api | partner-api | integration-spec
    summary: <한두 줄 요약>
    base_url: ""
    auth: ""                       # 예: API Key(Header), OAuth2 ...
    key_endpoints:
      - { method: GET, path: "/...", purpose: "" }
    key_params: ""
    rate_limit: ""
    error_handling: ""
    data_formats: ""               # 예: JSON, 필드 규격
    constraints: []
    integration_points: []         # 어떤 기능/플로우에서 호출되는가
    maps_to_requirement: []        # PRD/brief 의 FR/NFR id
    version: ""                    # 스펙 버전
    as_of: ""                      # 확인 기준일(ISO)
    sources:
      - { type: web, ref: "<url>", version: "", confidence: high }   # web | notion | local | ticket
    status: active                 # active | uncertain | deprecated
