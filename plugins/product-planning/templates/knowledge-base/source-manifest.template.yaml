# 소스 원장 (지식베이스) — dedupe / 버전충돌 / 증분수집의 단일 기준
# 수집한 모든 소스를 기록한다. 동일 기획 다중 버전은 최신본만 채택하고
# 구버전은 status: superseded 로 남긴다.
sources:
  - id: <kebab-id>
    type: local                    # notion | figma | local | web | image | gdrive | slack | ticket
    ref: "<url | page-id | figma:file#node | 파일경로>"
    title: <소스 제목/파일명>
    version: ""                    # 파일명 버전 토큰 등
    created: ""                    # ISO 날짜 (stat)
    modified: ""                   # ISO 날짜 (stat)
    confidence: high               # high | medium | low
    coverage: <이 소스가 다루는 범위>
    status: read                   # read | partial | skipped-binary | superseded | missing
    ingested_at: ""                # 수집 일시
